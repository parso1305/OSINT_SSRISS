<!-- Realistic IIT Bombay event listing where optional fields such as venue and description are missing -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Events | Indian Institute of Technology Bombay</title>
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <h1 class="page-title">Upcoming Campus Events</h1>
        </header>
        <main class="main-content">
            <div class="view-events-listing">
                <div class="view-content">
                    <div class="views-row event-card">
                        <div class="event-date">
                            <time datetime="2026-11-12">12 Nov 2026</time>
                        </div>
                        <div class="event-details">
                            <h3 class="event-title">
                                <a href="/event/robotics-club-orientation" class="event-link">Student Robotics Club Orientation</a>
                            </h3>
                            <!-- Optional venue omitted intentionally -->
                            <p class="event-description">Welcome session and mechanical design intro for incoming undergraduate cohorts.</p>
                        </div>
                    </div>
                    <div class="views-row event-card">
                        <div class="event-date">
                            <time datetime="2026-11-20">20 Nov 2026</time>
                        </div>
                        <div class="event-details">
                            <h3 class="event-title">
                                <a href="/event/aerospace-colloquium" class="event-link">Aerospace Engineering Department Colloquium</a>
                            </h3>
                            <!-- Both optional venue and description omitted intentionally -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
